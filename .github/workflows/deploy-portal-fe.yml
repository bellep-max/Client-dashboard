name: Deploy customer portal frontend

on:
  push:
    branches: [main]
    paths:
      - "artifacts/aeo-dashboard/**"
      - "lib/api-client-react/**"
      - "lib/api-zod/**"
      - "lib/api-spec/**"
      - "lib/integrations/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-portal-fe.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-portal-fe
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  PORTAL_S3_BUCKET: ${{ secrets.PORTAL_S3_BUCKET }}
  PORTAL_CLOUDFRONT_DIST_ID: ${{ secrets.PORTAL_CLOUDFRONT_DIST_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build aeo-dashboard
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: pnpm --filter @workspace/aeo-dashboard build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3 (no-cache index.html, long-cache hashed assets)
        run: |
          # Hashed assets (under assets/) — content-hashed, cache forever
          aws s3 sync artifacts/aeo-dashboard/dist/public/assets/ s3://$PORTAL_S3_BUCKET/assets/ \
            --delete \
            --cache-control 'public, max-age=31536000, immutable'

          # Non-hashed files (index.html, favicon, etc.) — short cache, must-revalidate
          aws s3 sync artifacts/aeo-dashboard/dist/public/ s3://$PORTAL_S3_BUCKET/ \
            --delete \
            --exclude 'assets/*' \
            --cache-control 'public, max-age=0, must-revalidate'

      - name: Invalidate CloudFront
        # The CloudFront API occasionally connect-times-out from the runner.
        # The deploy (S3 sync above) is already done at this point, so retry the
        # invalidation a few times before failing instead of red-Xing a good ship.
        run: |
          for attempt in 1 2 3; do
            if aws cloudfront create-invalidation \
                 --distribution-id "$PORTAL_CLOUDFRONT_DIST_ID" \
                 --paths '/*'; then
              echo "Deployed + invalidated (attempt $attempt). Visit your CloudFront URL to verify."
              exit 0
            fi
            echo "Invalidation attempt $attempt failed; retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "::error::CloudFront invalidation failed after 3 attempts (S3 sync already succeeded; rerun this step or invalidate manually)"
          exit 1
