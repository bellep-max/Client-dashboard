openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AEO Platform API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: business
    description: Business profile and onboarding
  - name: keywords
    description: Keyword management and AI generation
  - name: reports
    description: Bi-weekly performance reports
  - name: openai
    description: OpenAI AI chat operations
paths:
  # ─── Multi-Business ───────────────────────────────────────────────────────────
  /businesses:
    get:
      operationId: listBusinesses
      tags: [business]
      summary: List all businesses for the current user
      responses:
        "200":
          description: All businesses for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Business"

  /businesses/switch:
    post:
      operationId: switchBusiness
      tags: [business]
      summary: Switch the active business
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchBusinessInput"
      responses:
        "200":
          description: Switched to business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Business Profile ────────────────────────────────────────────────────────
  /businesses/me:
    get:
      operationId: getMyBusiness
      tags: [business]
      summary: Get the current user's business profile
      responses:
        "200":
          description: Business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createBusiness
      tags: [business]
      summary: Create a business profile (onboarding step 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
    patch:
      operationId: updateBusiness
      tags: [business]
      summary: Update the business profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"

  # ─── GBP ─────────────────────────────────────────────────────────────────────
  /businesses/me/gbp:
    get:
      operationId: listGbpProfiles
      tags: [business]
      summary: List GBP profiles for the current business
      responses:
        "200":
          description: GBP profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GbpProfile"
    post:
      operationId: addGbpProfile
      tags: [business]
      summary: Add a Google Business Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GbpProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GbpProfile"

  /businesses/me/gbp/{id}:
    patch:
      operationId: updateGbpProfile
      tags: [business]
      summary: Update a GBP profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GbpProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GbpProfile"
    delete:
      operationId: deleteGbpProfile
      tags: [business]
      summary: Remove a GBP profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Websites ─────────────────────────────────────────────────────────────────
  /businesses/me/websites:
    get:
      operationId: listWebsites
      tags: [business]
      summary: List websites for the current business
      responses:
        "200":
          description: Websites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Website"
    post:
      operationId: addWebsite
      tags: [business]
      summary: Add a website/link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Website"

  /businesses/me/websites/{id}:
    patch:
      operationId: updateWebsite
      tags: [business]
      summary: Update a website entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebsiteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Website"
    delete:
      operationId: deleteWebsite
      tags: [business]
      summary: Remove a website
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Keywords ─────────────────────────────────────────────────────────────────
  /businesses/me/keywords:
    get:
      operationId: listKeywords
      tags: [keywords]
      summary: List keywords for the current business
      responses:
        "200":
          description: Keywords
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Keyword"
    post:
      operationId: addKeyword
      tags: [keywords]
      summary: Add a keyword manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeywordInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keyword"

  /businesses/me/keywords/generate:
    post:
      operationId: generateKeywords
      tags: [keywords]
      summary: Use AI to generate keyword suggestions for the business
      responses:
        "200":
          description: Generated keywords
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeywordSuggestion"

  /businesses/me/keywords/suggestions:
    get:
      operationId: getKeywordSuggestions
      tags: [keywords]
      summary: Get ongoing AI-powered keyword improvement suggestions
      responses:
        "200":
          description: Keyword suggestions with efficiency analysis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeywordSuggestion"

  /businesses/me/keywords/{id}/links:
    get:
      operationId: listKeywordLinks
      tags: [keywords]
      summary: List links attached to a keyword
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Keyword links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeywordLink"
    post:
      operationId: addKeywordLink
      tags: [keywords]
      summary: Add a link to a keyword (triggers AI analysis)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeywordLinkInput"
      responses:
        "201":
          description: Created link with AI analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordLink"

  /businesses/me/keywords/links/{id}:
    delete:
      operationId: deleteKeywordLink
      tags: [keywords]
      summary: Remove a keyword link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /businesses/me/keywords/links/{id}/analyze:
    post:
      operationId: analyzeKeywordLink
      tags: [keywords]
      summary: Re-run AI analysis on a keyword link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated link with fresh AI analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordLink"

  /businesses/me/keywords/{id}:
    patch:
      operationId: updateKeyword
      tags: [keywords]
      summary: Update a keyword (edit text, notes)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeywordUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keyword"
    delete:
      operationId: deleteKeyword
      tags: [keywords]
      summary: Remove a keyword
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Reports ──────────────────────────────────────────────────────────────────
  /businesses/me/reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List bi-weekly performance reports
      responses:
        "200":
          description: Reports list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: generateReport
      tags: [reports]
      summary: Generate a new bi-weekly report
      responses:
        "201":
          description: Generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /businesses/me/reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get a specific report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ─── Dashboard Summary ────────────────────────────────────────────────────────
  /businesses/me/dashboard:
    get:
      operationId: getDashboardSummary
      tags: [reports]
      summary: Get dashboard summary metrics (keyword counts, visibility score, top keywords)
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ─── OpenAI Conversations ─────────────────────────────────────────────────────
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all AI agent conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new AI agent conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ─── Business ───────────────────────────────────────────────────────────────
    Business:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        businessName:
          type: string
        ownerName:
          type: string
        subscriberName:
          type: string
        industry:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        onboardingComplete:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isActive:
          type: boolean
      required:
        - id
        - userId
        - businessName
        - ownerName
        - subscriberName
        - onboardingComplete
        - isActive
        - createdAt
        - updatedAt

    BusinessInput:
      type: object
      properties:
        businessName:
          type: string
        ownerName:
          type: string
        subscriberName:
          type: string
        industry:
          type: string
        description:
          type: string
      required:
        - businessName
        - ownerName
        - subscriberName

    BusinessUpdate:
      type: object
      properties:
        businessName:
          type: string
        ownerName:
          type: string
        subscriberName:
          type: string
        industry:
          type: string
        description:
          type: string
        onboardingComplete:
          type: boolean

    # ─── GBP ────────────────────────────────────────────────────────────────────
    GbpProfile:
      type: object
      properties:
        id:
          type: integer
        businessId:
          type: integer
        placeId:
          type: ["string", "null"]
        businessName:
          type: string
        address:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        isVerified:
          type: boolean
        phoneNumber:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - businessId
        - businessName
        - isVerified
        - createdAt

    GbpProfileInput:
      type: object
      properties:
        businessName:
          type: string
        placeId:
          type: string
        address:
          type: string
        category:
          type: string
        isVerified:
          type: boolean
        phoneNumber:
          type: string
        website:
          type: string
      required:
        - businessName
        - isVerified

    GbpProfileUpdate:
      type: object
      properties:
        businessName:
          type: string
        address:
          type: string
        category:
          type: string
        isVerified:
          type: boolean
        phoneNumber:
          type: string
        website:
          type: string

    # ─── Website ─────────────────────────────────────────────────────────────────
    Website:
      type: object
      properties:
        id:
          type: integer
        businessId:
          type: integer
        url:
          type: string
        linkType:
          type: string
          enum: [backlink, blog, newsletter, news, social, directory, other]
        title:
          type: ["string", "null"]
        domainAuthority:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - businessId
        - url
        - linkType
        - createdAt

    WebsiteInput:
      type: object
      properties:
        url:
          type: string
        linkType:
          type: string
          enum: [backlink, blog, newsletter, news, social, directory, other]
        title:
          type: string
        domainAuthority:
          type: integer
      required:
        - url
        - linkType

    WebsiteUpdate:
      type: object
      properties:
        url:
          type: string
        linkType:
          type: string
          enum: [backlink, blog, newsletter, news, social, directory, other]
        title:
          type: string
        domainAuthority:
          type: integer

    # ─── Keywords ────────────────────────────────────────────────────────────────
    Keyword:
      type: object
      properties:
        id:
          type: integer
        businessId:
          type: integer
        keyword:
          type: string
        efficiencyScore:
          type: ["number", "null"]
        searchVolume:
          type: ["integer", "null"]
        currentPosition:
          type: ["integer", "null"]
        previousPosition:
          type: ["integer", "null"]
        isAiGenerated:
          type: boolean
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, paused, archived]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - businessId
        - keyword
        - isAiGenerated
        - status
        - createdAt
        - updatedAt

    KeywordInput:
      type: object
      properties:
        keyword:
          type: string
        notes:
          type: string
        isAiGenerated:
          type: boolean
      required:
        - keyword

    KeywordUpdate:
      type: object
      properties:
        keyword:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [active, paused, archived]

    KeywordSuggestion:
      type: object
      properties:
        keyword:
          type: string
        reason:
          type: string
        estimatedVolume:
          type: ["integer", "null"]
        efficiencyScore:
          type: number
      required:
        - keyword
        - reason
        - efficiencyScore

    SwitchBusinessInput:
      type: object
      properties:
        businessId:
          type: integer
      required:
        - businessId

    KeywordLink:
      type: object
      properties:
        id:
          type: integer
        keywordId:
          type: integer
        businessId:
          type: integer
        url:
          type: string
        description:
          type: ["string", "null"]
        linkType:
          type: string
        aiLifespanDays:
          type: ["integer", "null"]
        aiEfficiencyPercent:
          type: ["integer", "null"]
          description: "AI-assessed link efficiency for AEO, 0–100"
        aiAnalysis:
          type: ["string", "null"]
        analyzedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - keywordId
        - businessId
        - url
        - linkType
        - createdAt

    KeywordLinkInput:
      type: object
      properties:
        url:
          type: string
        description:
          type: string
        linkType:
          type: string
          enum: [backlink, blog, newsletter, news, social, directory, citation, other]
      required:
        - url
        - linkType

    # ─── Reports ─────────────────────────────────────────────────────────────────
    Report:
      type: object
      properties:
        id:
          type: integer
        businessId:
          type: integer
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        visibilityScore:
          type: ["number", "null"]
        totalImpressions:
          type: ["integer", "null"]
        totalClicks:
          type: ["integer", "null"]
        averagePosition:
          type: ["number", "null"]
        keywordsTracked:
          type: integer
        keywordsImproved:
          type: integer
        keywordsDeclined:
          type: integer
        aiSummary:
          type: ["string", "null"]
        topKeywords:
          type: array
          items:
            $ref: "#/components/schemas/ReportKeyword"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - businessId
        - periodStart
        - periodEnd
        - keywordsTracked
        - keywordsImproved
        - keywordsDeclined
        - topKeywords
        - createdAt

    ReportKeyword:
      type: object
      properties:
        keyword:
          type: string
        position:
          type: ["integer", "null"]
        change:
          type: ["integer", "null"]
        impressions:
          type: ["integer", "null"]
      required:
        - keyword

    DashboardSummary:
      type: object
      properties:
        totalKeywords:
          type: integer
        activeKeywords:
          type: integer
        averageEfficiencyScore:
          type: ["number", "null"]
        visibilityScore:
          type: ["number", "null"]
        visibilityChange:
          type: ["number", "null"]
        totalWebsites:
          type: integer
        gbpVerified:
          type: boolean
        recentKeywordTrend:
          type: string
          enum: [improving, declining, stable, unknown]
        lastReportDate:
          type: ["string", "null"]
          format: date-time
        topKeywords:
          type: array
          items:
            $ref: "#/components/schemas/Keyword"
        onboardingComplete:
          type: boolean
      required:
        - totalKeywords
        - activeKeywords
        - totalWebsites
        - gbpVerified
        - recentKeywordTrend
        - onboardingComplete

    # ─── OpenAI ──────────────────────────────────────────────────────────────────
    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
